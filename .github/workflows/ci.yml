name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Python Tests
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run test suite
        run: pytest -q tests/

  load-test:
    name: Locust Load Test
    runs-on: ubuntu-latest
    needs: test
    env:
      LOCUST_MAX_ERROR_RATE: "0.05"
      LOCUST_MAX_P95_MS: "2000"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Start backend
        env:
          APP_ENV: test
          AUTH_ENABLED: "false"
          STORAGE_BACKEND: json
          DATA_DIR: data/test_artifacts/load-test
          ENABLE_BACKGROUND_JOBS: "false"
          PUBLIC_DEMO_MODE: "true"
        run: |
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > uvicorn-load-test.log 2>&1 &
          echo $! > uvicorn-load-test.pid
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/health/live; then
              exit 0
            fi
            sleep 1
          done
          cat uvicorn-load-test.log
          exit 1

      - name: Run headless Locust
        run: |
          locust -f locust/locustfile.py \
            --host http://127.0.0.1:8000 \
            --headless \
            -u 5 \
            -r 2 \
            --run-time 30s \
            --only-summary

      - name: Stop backend
        if: always()
        run: |
          if [ -f uvicorn-load-test.pid ]; then
            kill "$(cat uvicorn-load-test.pid)" || true
          fi
