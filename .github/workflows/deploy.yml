name: Deploy to AWS EKS

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  TF_IN_AUTOMATION: "true"
  TF_VAR_aws_region: ${{ vars.AWS_REGION }}
  TF_VAR_cluster_name: ${{ vars.CLUSTER_NAME }}
  TF_VAR_environment: ${{ vars.ENVIRONMENT }}
  TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}
  TF_VAR_openai_api_key: ${{ secrets.TF_VAR_OPENAI_API_KEY }}
  TF_VAR_auth_enabled: ${{ vars.AUTH_ENABLED || 'false' }}
  TF_VAR_viewer_api_token: ${{ secrets.TF_VAR_VIEWER_API_TOKEN }}
  TF_VAR_operator_api_token: ${{ secrets.TF_VAR_OPERATOR_API_TOKEN }}
  TF_VAR_remediation_token: ${{ secrets.TF_VAR_REMEDIATION_TOKEN }}
  TF_VAR_slack_bot_token: ${{ secrets.TF_VAR_SLACK_BOT_TOKEN }}
  TF_VAR_slack_channel: ${{ vars.SLACK_CHANNEL || '#ops-oncall' }}
  TF_VAR_jira_base_url: ${{ vars.JIRA_BASE_URL }}
  TF_VAR_jira_email: ${{ vars.JIRA_EMAIL }}
  TF_VAR_jira_api_token: ${{ secrets.TF_VAR_JIRA_API_TOKEN }}
  TF_VAR_jira_labels: ${{ vars.JIRA_LABELS || 'ai-incident-commander,agentic-ai' }}
  TF_VAR_prometheus_base_url: ${{ vars.PROMETHEUS_BASE_URL }}
  TF_VAR_github_token: ${{ secrets.TF_VAR_GITHUB_TOKEN }}
  TF_VAR_enable_release_correlation: ${{ vars.ENABLE_RELEASE_CORRELATION || 'false' }}
  TF_VAR_github_repo: ${{ vars.GITHUB_REPO }}
  TF_VAR_github_workflow_name: ${{ vars.GITHUB_WORKFLOW_NAME }}
  TF_VAR_prometheus_bearer_token: ${{ secrets.TF_VAR_PROMETHEUS_BEARER_TOKEN }}
  TF_VAR_enable_tracing: ${{ vars.ENABLE_TRACING || 'false' }}
  TF_VAR_otlp_endpoint: ${{ secrets.TF_VAR_OTLP_ENDPOINT }}

jobs:
  terraform-plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        run: |
          terraform -chdir=terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ vars.ENVIRONMENT }}/${{ vars.CLUSTER_NAME }}/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_STATE_LOCK_TABLE }}"

      - name: Terraform validate
        run: |
          terraform -chdir=terraform fmt -check
          terraform -chdir=terraform validate

      - name: Terraform plan
        run: terraform -chdir=terraform plan -input=false -no-color

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        run: |
          terraform -chdir=terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ vars.ENVIRONMENT }}/${{ vars.CLUSTER_NAME }}/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_STATE_LOCK_TABLE }}"

      - name: Terraform apply
        run: terraform -chdir=terraform apply -input=false -auto-approve

      - name: Capture Terraform outputs
        id: tf
        run: |
          echo "backend_repo=$(terraform -chdir=terraform output -raw backend_ecr_repository_url)" >> "$GITHUB_OUTPUT"
          echo "frontend_repo=$(terraform -chdir=terraform output -raw frontend_ecr_repository_url)" >> "$GITHUB_OUTPUT"
          echo "cluster_name=${{ vars.CLUSTER_NAME }}" >> "$GITHUB_OUTPUT"
          echo "app_secret_arn=$(terraform -chdir=terraform output -raw app_secret_arn)" >> "$GITHUB_OUTPUT"
          echo "app_irsa_role_arn=$(terraform -chdir=terraform output -raw app_irsa_role_arn)" >> "$GITHUB_OUTPUT"
          echo "adot_collector_irsa_role_arn=$(terraform -chdir=terraform output -raw adot_collector_irsa_role_arn)" >> "$GITHUB_OUTPUT"

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        env:
          BACKEND_REPO: ${{ steps.tf.outputs.backend_repo }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "$BACKEND_REPO:$IMAGE_TAG" .
          docker push "$BACKEND_REPO:$IMAGE_TAG"

      - name: Build and push frontend image
        env:
          FRONTEND_REPO: ${{ steps.tf.outputs.frontend_repo }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_BASE_URL=/api \
            --build-arg NEXT_PUBLIC_API_TOKEN= \
            -t "$FRONTEND_REPO:$IMAGE_TAG" \
            ./frontend
          docker push "$FRONTEND_REPO:$IMAGE_TAG"

      - name: Wait for EKS cluster and node group
        run: |
          aws eks wait cluster-active --name "${{ vars.CLUSTER_NAME }}" --region "${{ env.AWS_REGION }}"
          aws eks wait nodegroup-active \
            --cluster-name "${{ vars.CLUSTER_NAME }}" \
            --nodegroup-name "${{ vars.CLUSTER_NAME }}-managed-ng" \
            --region "${{ env.AWS_REGION }}"

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --region "${{ env.AWS_REGION }}" --name "${{ vars.CLUSTER_NAME }}"

      - name: Render Kubernetes manifests
        env:
          BACKEND_IMAGE: ${{ steps.tf.outputs.backend_repo }}:${{ github.sha }}
          FRONTEND_IMAGE: ${{ steps.tf.outputs.frontend_repo }}:${{ github.sha }}
          APP_SECRET_ARN: ${{ steps.tf.outputs.app_secret_arn }}
          APP_IRSA_ROLE_ARN: ${{ steps.tf.outputs.app_irsa_role_arn }}
          ADOT_COLLECTOR_IRSA_ROLE_ARN: ${{ steps.tf.outputs.adot_collector_irsa_role_arn }}
        run: |
          mkdir -p rendered-k8s
          python - <<'PY'
          import os
          from pathlib import Path

          src = Path("k8s")
          dst = Path("rendered-k8s")
          for path in src.glob("*.yaml"):
              text = path.read_text(encoding="utf-8")
              for key, value in os.environ.items():
                  text = text.replace("${" + key + "}", value)
              (dst / path.name).write_text(text, encoding="utf-8")
          PY

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f rendered-k8s/namespace.yaml
          kubectl apply -f rendered-k8s/

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/adot-collector -n ai-incident-commander --timeout=5m
          kubectl rollout status deployment/backend -n ai-incident-commander --timeout=5m
          kubectl rollout status deployment/frontend -n ai-incident-commander --timeout=5m
