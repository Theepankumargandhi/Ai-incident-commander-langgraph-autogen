apiVersion: v1
kind: ConfigMap
metadata:
  name: adot-collector-config
  namespace: ai-incident-commander
data:
  collector-config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 256
      batch:
      resource:
        attributes:
          - key: service.namespace
            action: upsert
            value: ai-incident-commander

    exporters:
      awsxray:
        region: ${AWS_REGION}

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    service:
      extensions: [health_check]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch, resource]
          exporters: [awsxray]
