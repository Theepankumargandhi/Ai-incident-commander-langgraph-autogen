apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: ai-incident-commander
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      serviceAccountName: backend-service-account
      containers:
        - name: backend
          image: ${BACKEND_IMAGE}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: JUDGE_FINE_TUNED_MODEL
              valueFrom:
                secretKeyRef:
                  name: backend-app-env
                  key: JUDGE_FINE_TUNED_MODEL
            - name: SLACK_SIGNING_SECRET
              valueFrom:
                secretKeyRef:
                  name: backend-app-env
                  key: SLACK_SIGNING_SECRET
          envFrom:
            - secretRef:
                name: backend-app-env
          volumeMounts:
            - name: secrets-store-inline
              mountPath: /mnt/secrets-store
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: secrets-store-inline
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: backend-secrets
